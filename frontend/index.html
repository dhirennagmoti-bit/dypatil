    <!-- Privacy-Friendly Analytics Provider (Item 18) -->
    <script>
      window.insureAnalytics = {
        track: function(eventName, props) {
          try {
            const payload = {
              event: eventName,
              timestamp: new Date().toISOString(),
              path: window.location.pathname,
              props: props || {}
            };
            if (window.console && window.console.info) {
              window.console.info('[InsureAnalytics]', eventName, payload);
            }
          } catch(e) {}
        },
        page: function() {
          this.track('pageview', { title: document.title, url: window.location.href });
        }
      };
      window.addEventListener('DOMContentLoaded', function() {
        window.insureAnalytics.page();
      });
    </script>
